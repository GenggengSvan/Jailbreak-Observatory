name: Refresh Google Scholar citations

on:
  schedule:
    # First day of each month at 04:17 UTC.
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh citation counts
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # Keep the default run within SerpApi's free monthly quota; unknown
          # conference candidates rotate across subsequent monthly runs.
          SERPAPI_MAX_QUERIES: "250"
        run: python3 scripts/update_citations.py
      - name: Rebuild visualization data
        run: python3 scripts/build_site_data.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No citation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add citations_over_50.md data/citation_catalog.json data/citation_history.json README.md docs/data.js
          git commit -m "Refresh citation counts"
          git push
