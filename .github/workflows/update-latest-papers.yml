name: Refresh latest conference papers

on:
  schedule:
    # First day of each month at 05:17 UTC.
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-latest-papers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install beautifulsoup4
      - name: Check and refresh latest editions
        run: python3 scripts/update_latest_papers.py
      - name: Rebuild visualization data
        run: python3 scripts/build_site_data.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No conference changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Conference data/conference_2026.json data/conference_update_history.json README.md docs/data.js
          git commit -m "Refresh latest conference papers"
          git push
