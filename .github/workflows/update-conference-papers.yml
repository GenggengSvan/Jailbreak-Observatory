name: Update conference papers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler dependencies
        run: python -m pip install beautifulsoup4
      - name: Crawl official proceedings and accepted-paper pages
        run: |
          python scripts/update_conference_papers.py
          python scripts/update_2026_papers.py
      - name: Rebuild visualization data
        run: python scripts/build_site_data.py
      - name: Commit changed records
        run: |
          if git diff --quiet; then
            echo "No conference updates found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Conference data/conference_latest.json data/conference_2026.json README.md docs/data.js
          git commit -m "Update published and accepted conference papers"
          git push
